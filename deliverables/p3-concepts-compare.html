<title>체크라인 3차 시안 비교</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 미리보기 크롬(탭·토글·설명) + 1440 기준 목업을 화면 폭에 맞춰 축소 */
:root{
  --pg:#EEEFF1; --pg-fg:#171719; --pg-sub:#6E7076; --pg-line:#D9DADD; --pg-card:#FFFFFF; --pg-acc:#0066FF;
  --font:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--pg:#101112;--pg-fg:#F2F3F4;--pg-sub:#9A9CA2;--pg-line:#2C2D31;--pg-card:#1B1C1E;--pg-acc:#3385FF;color-scheme:dark}}
:root[data-theme="dark"]{--pg:#101112;--pg-fg:#F2F3F4;--pg-sub:#9A9CA2;--pg-line:#2C2D31;--pg-card:#1B1C1E;--pg-acc:#3385FF;color-scheme:dark}
body{background:var(--pg);color:var(--pg-fg);font-family:var(--font);font-size:14px;line-height:1.5}
.wrap{max-width:1480px;margin:0 auto;padding-inline:20px;padding-block:28px 48px;display:grid;gap:20px}
header.top h1{font-size:22px;margin:0 0 4px;text-wrap:balance}
header.top p{margin:0;color:var(--pg-sub);max-width:70ch}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.tabs,.seg{display:flex;gap:4px;background:var(--pg-card);border:1px solid var(--pg-line);border-radius:12px;padding:4px;flex-wrap:wrap}
.tabs button,.seg button{font:inherit;border:0;background:transparent;color:var(--pg-sub);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500}
.tabs button[aria-selected="true"],.seg button[aria-pressed="true"]{background:var(--pg-fg);color:var(--pg-card)}
button:focus-visible{outline:2px solid var(--pg-acc);outline-offset:2px}
.right{display:flex;gap:12px;flex-wrap:wrap}
.note{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.note div{background:var(--pg-card);border:1px solid var(--pg-line);border-radius:12px;padding:14px 16px;min-width:0}
.note b{display:block;margin-bottom:2px}
.note span{color:var(--pg-sub)}
.fit{width:100%;overflow:hidden;border-radius:12px;border:1px solid var(--pg-line)}
.stage{width:1440px;transform-origin:top left}
.rules{display:flex;flex-wrap:wrap;gap:8px 20px;color:var(--pg-sub);font-size:13px}
.rules i{font-style:normal;color:var(--pg-fg);font-weight:700;margin-right:4px}

/* ===== 목업: 원티드 DS Theme 근사값 (Light / Dark) ===== */
.mock{
  --primary:#0066FF; --label:#171719; --neutral:#46474C; --alt:#8A8B90; --assist:#B5B6B9;
  --bg:#FFFFFF; --bg-alt:#F0F0F2; --line:#E8E9EB; --fill:#F2F3F4;
  --neg:#FF4242; --cau:#FF9200; --pos:#00BF40; --vio:#6541F2; --ina:#A3A5AA; --ok:#D5D7DB; --on-primary:#FFFFFF;
  background:var(--bg-alt); color:var(--label); font-family:var(--font); display:grid; grid-template-columns:216px 1fr; min-height:900px;
}
.mock.dark{
  --primary:#3385FF; --label:#F4F4F5; --neutral:#C2C4C8; --alt:#8D8F95; --assist:#5E6066;
  --bg:#212225; --bg-alt:#1B1B1D; --line:#2C2D31; --fill:#26272A;
  --neg:#FF6363; --cau:#FFA938; --pos:#1ED45A; --vio:#8E73FF; --ina:#70737C; --ok:#3A3B3F; --on-primary:#FFFFFF;
}
.mock *{box-sizing:border-box}
.side{background:var(--bg);padding:28px 14px;display:flex;flex-direction:column;gap:2px}
.logo{display:flex;gap:8px;align-items:center;font-weight:700;font-size:17px;color:var(--primary);padding:0 10px 22px}
.nav{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;color:var(--alt);font-weight:500;font-size:15px}
.nav.on{background:var(--fill);color:var(--label);font-weight:700}
.nav.on svg{color:var(--primary)}
.main{padding:30px 36px 40px;display:grid;gap:20px;align-content:start;min-width:0}
.head{display:flex;align-items:center;gap:16px}
.head h2{margin:0;font-size:24px;line-height:1.33}
.head small{display:block;color:var(--alt);font-size:13px}
.head .chips{margin-left:auto;display:flex;gap:6px}
.chip{border:1px solid var(--line);border-radius:8px;padding:5px 11px;font-size:13px;color:var(--neutral);background:var(--bg)}
.chip.on{background:var(--label);border-color:var(--label);color:var(--bg);font-weight:700}
.card{background:var(--bg);border-radius:16px;padding:22px 24px;display:grid;gap:14px;align-content:start;min-width:0}
.ct{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700}
.ct .more{margin-left:auto;font-size:13px;font-weight:500;color:var(--alt)}
.muted .ct{font-size:15px;color:var(--neutral)}
.btn{border-radius:8px;padding:8px 14px;font-size:13px;font-weight:700;white-space:nowrap;border:1px solid var(--line);color:var(--label);background:var(--bg)}
.btn.p{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
/* 상태: 아이콘(또는 점) + 색 글자, 바탕 없음 */
.st{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;white-space:nowrap}
.st .d{width:7px;height:7px;border-radius:50%;background:currentColor}
.st.neg{color:var(--neg)} .st.cau{color:var(--cau)} .st.ina{color:var(--ina)} .st.vio{color:var(--vio)} .st.pos{color:var(--pos)}
.num{font-variant-numeric:tabular-nums}
.sub{color:var(--alt);font-size:13px}
/* 막대 */
.track{display:flex;gap:2px;height:10px}
.track span{border-radius:3px;height:100%}
.prog{height:6px;border-radius:3px;background:var(--fill);overflow:hidden}
.prog span{display:block;height:100%;background:var(--neutral);border-radius:3px}
.leg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--neutral)}
.leg b{color:var(--label);margin-left:4px}
/* 수리 단계: 숫자 + 선 */
.steps{display:flex;align-items:flex-start}
.steps .s{display:grid;justify-items:center;gap:2px;min-width:0}
.steps .s b{font-size:20px;line-height:1.3}
.steps .s span{font-size:12px;color:var(--alt);white-space:nowrap}
.steps .ln{flex:1;min-width:8px;height:1px;background:var(--line);margin:14px 6px 0}
/* 표 */
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{color:var(--alt);font-weight:500;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
table.t td{padding:10px;border-bottom:1px solid var(--line);color:var(--neutral)}
table.t td:nth-child(2){color:var(--label);font-weight:700}
/* [주목] 영역 표시 (검토용) */
.mock.show-focus .focus{outline:2px dashed var(--primary);outline-offset:6px;position:relative}
.mock.show-focus .focus::before{content:"[주목]";position:absolute;top:-30px;right:0;font-size:12px;font-weight:700;color:var(--primary)}

/* A — 상단 히어로 */
.hero{display:grid;grid-template-columns:260px 1fr;gap:32px;padding:28px 32px}
.hero .big{display:grid;align-content:start;gap:6px}
.hero .big span{font-size:15px;font-weight:700;color:var(--neutral)}
.hero .big strong{font-size:64px;line-height:1;letter-spacing:-0.02em}
.hero .big strong small{font-size:22px;margin-left:4px;color:var(--neutral)}
.hero .big p{margin:6px 0 0;color:var(--alt);font-size:13px;line-height:1.6}
.todo{display:grid}
.todo .r{display:grid;grid-template-columns:96px 1fr 130px 120px;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.todo .r:last-child{border-bottom:0}
.todo .nm{font-weight:700;font-size:16px}
.todo .nm small{display:block;font-weight:400;font-size:13px;color:var(--alt)}
.todo .el{font-weight:700;font-size:14px;text-align:right}
.todo .btn{justify-self:end}
.grid3{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:20px}

/* B — 왼쪽 대기열 */
.bcols{display:grid;grid-template-columns:540px 1fr;gap:24px;align-items:start}
.queue{display:grid;gap:12px}
.qh{display:flex;align-items:baseline;gap:10px}
.qh strong{font-size:40px;line-height:1}
.qh span{font-weight:700;color:var(--neutral)}
.qi{background:var(--bg);border-radius:14px;padding:18px 20px;display:grid;grid-template-columns:1fr auto;gap:8px 16px;align-items:center}
.qi .nm{font-size:17px;font-weight:700}
.qi .ds{grid-column:1;color:var(--alt);font-size:13px}
.qi .meta{display:flex;gap:10px;align-items:center}
.qi .el{font-weight:700;font-size:14px}
.qi .btn{grid-row:1 / span 3;grid-column:2}
.qi.first{padding:22px 22px}
.qi.first .nm{font-size:20px}
.over{display:grid;gap:20px}
.over .two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.lr{display:grid;grid-template-columns:52px 1fr 44px;gap:10px;align-items:center;font-size:13px}
.lr b{color:var(--neutral)}
.lr i{font-style:normal;color:var(--alt);text-align:right}

/* C — 히트맵 중심 */
.heat{padding:26px 28px;gap:18px}
.hrow{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center;min-height:48px}
.hrow > b{font-size:15px}
.cells{display:flex;gap:5px;align-items:center;position:relative}
.cell{width:32px;height:32px;border-radius:8px;background:var(--ok)}
.cell.neg{background:var(--neg)} .cell.cau{background:var(--cau)} .cell.ina{background:var(--ina)} .cell.vio{background:var(--vio)}
.callout{display:flex;align-items:center;gap:12px;margin-left:14px;padding:8px 8px 8px 14px;background:var(--bg);border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.10),0 0 0 1px var(--line)}
.callout .nm{font-weight:700;font-size:14px;white-space:nowrap}
.callout .el{font-weight:700;font-size:13px;color:var(--neg);white-space:nowrap}
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.kv{display:grid;gap:6px}
.kv .k{color:var(--alt);font-size:13px;font-weight:500}
.kv .v{font-size:22px;font-weight:700}
.kv .v small{font-size:13px;color:var(--alt);font-weight:500;margin-left:3px}

/* A′ — 히어로 + 시각화 */
.heroV{display:grid;grid-template-columns:380px 1fr;gap:40px;padding:28px 32px}
.heroV .lt{display:grid;gap:16px;align-content:start}
.heroV h3{margin:0;font-size:16px;font-weight:700;display:flex;align-items:baseline;gap:6px}
.heroV h3 strong{font-size:36px;line-height:1}
.mini{display:grid;gap:6px}
.mrow{display:grid;grid-template-columns:40px 1fr;align-items:center;font-size:12px;color:var(--alt);font-weight:500}
.mcells{display:flex;gap:3px}
.mc{width:18px;height:18px;border-radius:4px;background:var(--ok);display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;line-height:1}
.mc.other{background:var(--ina)} .mc.neg{background:var(--neg)} .mc.cau{background:var(--cau)}
.cap{font-size:12px;color:var(--alt)}
.no{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700;flex:none}
.todoV .r{display:grid;grid-template-columns:24px 92px 1fr auto 130px;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.todoV .r:last-child{border-bottom:0}
.todoV .nm{font-weight:700;font-size:16px}
.todoV .nm small{display:block;font-weight:400;font-size:13px;color:var(--alt)}
.todoV .el{font-weight:700;font-size:14px;text-align:right;white-space:nowrap}
.todoV .btn{justify-self:end}
.donut{display:grid;grid-template-columns:128px 1fr;gap:20px;align-items:center}
.donut svg text{fill:var(--label)}
.dl{display:grid;gap:6px;font-size:13px}
.dl div{display:flex;justify-content:space-between;gap:8px}
.dl b{color:var(--label)}
.ringw{display:grid;grid-template-columns:96px 1fr;gap:18px;align-items:center}
.ringw svg text{fill:var(--label)}
.lp{display:grid;grid-template-columns:40px 1fr 36px;gap:8px;align-items:center;font-size:12px;color:var(--alt)}
.cols{display:flex;align-items:flex-end;gap:14px;height:120px;padding-top:6px}
.cols .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:flex-end;height:100%}
.cols .c b{font-size:14px}
.cols .c i{display:block;width:100%;max-width:36px;border-radius:4px 4px 0 0;background:var(--assist)}
.cols .c span{font-size:11px;color:var(--alt);white-space:nowrap}
.cols .c.today i{background:var(--neutral)}
.cols .c.today span{color:var(--label);font-weight:700}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:20px}
.tag{font-size:11px;font-weight:700;color:var(--primary);margin-left:6px}
@media (prefers-reduced-motion:no-preference){.stage{transition:opacity .15s}}
</style>

<div class="wrap">
  <header class="top">
    <h1>체크라인 관리자 대시보드 · 3차 시안</h1>
    <p>시선이 갈 곳을 화면마다 한 곳으로 정하고, 세 시안은 그 한 곳을 만드는 방식만 다르게 했어요. 아직 Figma에는 만들지 않은 구성 확인용 시안이에요.</p>
  </header>

  <div class="bar">
    <div class="tabs" role="tablist" aria-label="시안">
      <button id="tab-fig" role="tab" aria-selected="true" data-c="fig">Figma 결과 (A · 여백 정리)</button>
      <button id="tab-fig0" role="tab" aria-selected="false" data-c="fig0">Figma 이전</button>
      <button id="tab-a2" role="tab" aria-selected="false" data-c="a2">A 확정안</button>
      <button id="tab-a" role="tab" aria-selected="false" data-c="a">A 상단 히어로</button>
      <button id="tab-b" role="tab" aria-selected="false" data-c="b">B 왼쪽 처리 대기열</button>
      <button id="tab-c" role="tab" aria-selected="false" data-c="c">C 히트맵 중심</button>
    </div>
    <div class="right">
      <div class="seg" aria-label="목업 테마">
        <button id="m-light" aria-pressed="true" data-m="light">Light</button>
        <button id="m-dark" aria-pressed="false" data-m="dark">Dark</button>
      </div>
      <div class="seg">
        <button id="m-focus" aria-pressed="false">[주목] 영역 표시</button>
      </div>
    </div>
  </div>

  <div class="note" id="note"></div>

  <div class="fit" id="fit"><div class="stage" id="stage"></div></div>

  <div class="rules">
    <span><i>⑩</i>카드에 상태 색 테두리 없음</span>
    <span><i>⑪</i>아이콘·상태 뒤 옅은 바탕 없음 (상태 = 아이콘·점 + 색 글자)</span>
    <span><i>⑫</i>[주목] 영역은 화면당 1개, 큰 숫자·파란 버튼은 그 안에만</span>
  </div>
</div>

<template id="icons">
</template>

<script>
const I = {
  alert:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 2.5 20h19L12 3.5Z"/><path d="M12 10v4.5"/><path d="M12 17.2v.1"/></svg>',
  check:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12.3 2.7 2.7L16 9.6"/></svg>',
  home:'<path d="M4 10.5 12 4l8 6.5V20h-5v-5H9v5H4z"/>',
  grid:'<circle cx="6" cy="6" r="1"/><circle cx="12" cy="6" r="1"/><circle cx="18" cy="6" r="1"/><circle cx="6" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="18" cy="12" r="1"/><circle cx="6" cy="18" r="1"/><circle cx="12" cy="18" r="1"/><circle cx="18" cy="18" r="1"/>',
  doc:'<path d="M6 3h8l4 4v14H6z"/><path d="M9 12h6M9 16h6"/>',
  bell:'<path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5h4"/>',
  cal:'<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>',
  users:'<circle cx="9" cy="9" r="3.2"/><path d="M3.5 19c.6-3 2.8-4.5 5.5-4.5s4.9 1.5 5.5 4.5"/><circle cx="17" cy="9.5" r="2.4"/><path d="M16.5 14.6c2 .2 3.5 1.6 4 4.4"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/>'
};
const nv = (k) => `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${I[k]}</svg>`;
const st = (s) => {
  const m = {"가동 정지":["neg",I.alert],"이상":["cau",'<i class="d"></i>'],"미점검":["ina",'<i class="d"></i>'],"수리 중":["vio",'<i class="d"></i>'],"정상":["pos",'<i class="d"></i>']}[s];
  return `<span class="st ${m[0]}">${m[1]}${s}</span>`;
};
const COUNTS=[["가동 정지",2,"neg"],["이상",5,"cau"],["미점검",7,"ina"],["수리 중",3,"vio"],["정상",42,"ok"]];
const LINES=[["A라인",16,{neg:1,cau:2,ina:1,vio:1}],["B라인",14,{neg:1,cau:1,ina:2,vio:1}],["C라인",12,{cau:2,ina:1,vio:1}],["D라인",9,{ina:1}],["물류",8,{ina:2}]];
const col = (k) => k==="ok" ? "var(--ok)" : `var(--${k})`;
function shell(title, body){
  const navs=[["home","대시보드",1],["grid","설비"],["doc","점검 기록"],["bell","이상 보고"],["cal","수리"],["users","담당자"],["gear","설정"]];
  return `<aside class="side"><div class="logo">${I.check}체크라인</div>${navs.map(([k,l,on])=>`<div class="nav${on?" on":""}">${nv(k)}${l}</div>`).join("")}</aside>
  <section class="main"><div class="head"><div><h2>${title}</h2><small>10월 10일 토요일 · 11:20 갱신</small></div>
  <div class="chips"><span class="chip on">전체 라인</span><span class="chip">A라인</span><span class="chip">B라인</span><span class="chip">C라인</span><span class="chip">D라인</span><span class="chip">물류</span></div></div>${body}</section>`;
}
const stacked = () => `<div class="track">${COUNTS.map(([s,n,k])=>`<span style="flex:${n};background:${col(k)}"></span>`).join("")}</div>
  <div class="leg">${COUNTS.map(([s,n])=>`<span>${st(s)}<b class="num">${n}</b></span>`).join("")}</div>`;
const steps = () => `<div class="steps">${[["접수",1],["배정",2],["수리 중",3],["수리 완료",1],["재가동 확인",1]].map(([s,n],i,a)=>`<div class="s"><b class="num">${n}</b><span>${s}</span></div>${i<a.length-1?'<div class="ln"></div>':""}`).join("")}</div>`;
const lineBars = () => LINES.map(([l,t,m])=>{const ok=t-Object.values(m).reduce((a,b)=>a+b,0);return `<div class="lr"><b>${l}</b><div class="track">${["neg","cau","ina","vio"].filter(k=>m[k]).map(k=>`<span style="flex:${m[k]};background:${col(k)}"></span>`).join("")}<span style="flex:${ok};background:var(--ok)"></span><span style="flex:${16-t}"></span></div><i class="num">${t}대</i></div>`}).join("");

function donut(){const R=46,Cc=2*Math.PI*R,T=59;let off=0;const segs=COUNTS.map(([s,n,k])=>{const len=Cc*n/T;const el=`<circle cx="60" cy="60" r="${R}" fill="none" stroke="${col(k)}" stroke-width="16" stroke-dasharray="${Math.max(len-2,1)} ${Cc}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"/>`;off+=len;return el}).join("");
 return `<div class="donut"><svg width="128" height="128" viewBox="0 0 120 120" role="img" aria-label="전체 59대 상태 도넛">${segs}<text x="60" y="58" text-anchor="middle" font-size="22" font-weight="700">59</text><text x="60" y="76" text-anchor="middle" font-size="11" style="fill:var(--alt)">대</text></svg>
 <div class="dl">${COUNTS.map(([s,n])=>`<div>${st(s)}<b class="num">${n}</b></div>`).join("")}</div></div>`;}
function ring(p){const R=38,Cc=2*Math.PI*R;return `<svg width="96" height="96" viewBox="0 0 96 96" role="img" aria-label="점검 완료율 ${p}%"><circle cx="48" cy="48" r="${R}" fill="none" stroke="var(--fill)" stroke-width="10"/><circle cx="48" cy="48" r="${R}" fill="none" stroke="var(--neutral)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${Cc*p/100} ${Cc}" transform="rotate(-90 48 48)"/><text x="48" y="54" text-anchor="middle" font-size="18" font-weight="700">${p}%</text></svg>`;}
function cols(items,max){return `<div class="cols">${items.map(([l,n,today])=>`<div class="c${today?" today":""}"><b class="num">${n}</b><i style="height:${Math.max(4,n/max*78)}px"></i><span>${l}</span></div>`).join("")}</div>`;}
function miniMap(){
 const mark={"A라인":[["neg","1"],["cau","3"]],"B라인":[["neg","2"]]};
 return `<div class="mini">${LINES.map(([l,t,m])=>{const probs=Object.values(m).reduce((a,b)=>a+b,0);const mk=mark[l]||[];const cells=[];mk.forEach(([k,n])=>cells.push(`<span class="mc ${k}">${n}</span>`));for(let i=mk.length;i<probs;i++)cells.push('<span class="mc other"></span>');while(cells.length<t)cells.push('<span class="mc"></span>');return `<div class="mrow">${l}<div class="mcells">${cells.join("")}</div></div>`}).join("")}</div>
 <div class="cap">번호 = 지금 처리할 설비 · 진한 회색 = 그 외 문제 설비 · 칸 하나 = 1대</div>`;}
